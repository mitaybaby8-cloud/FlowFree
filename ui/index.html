<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowFree</title><link rel="stylesheet" href="style.css"></head>
<body><header><div><h1>FlowFree</h1><p>Google Flow batch engine • Mac ARM64</p></div><div class="connect"><span id="statusDot"></span><span id="accountText">Chưa kết nối</span><button id="connectBtn">Connect Google</button></div></header>
<nav><button class="tab active" data-tab="images">ẢNH</button><button class="tab" data-tab="videos">VIDEO</button><button class="tab" data-tab="logs">NHẬT KÝ</button></nav>
<main>
<section id="images" class="panel active"><div class="grid"><label>Prompt batch<textarea id="imagePrompts" placeholder="001 prompt...&#10;002 prompt..."></textarea></label><div class="stack"><label>Model<select id="imageModel"><option value="ui-default">UI Default</option></select></label><label>Tỷ lệ<select id="imageRatio"><option>ui-default</option></select></label><label>Ảnh tham chiếu chung<div class="row"><input id="imageRefs" readonly><button id="pickImageRefs">Chọn ảnh</button></div></label><label>Thư mục ảnh<div class="row"><input id="imageOut" readonly><button data-dir="imageOut">Chọn</button></div></label><label><input type="checkbox" id="imageResume" checked> Resume, bỏ qua file đã xong</label><button class="primary" id="runImages">CHẠY ẢNH</button></div></div></section>
<section id="videos" class="panel"><div class="grid"><label>Prompt batch<textarea id="videoPrompts" placeholder="001 prompt video...&#10;002 prompt video..."></textarea></label><div class="stack"><label>Chế độ<select id="videoMode"><option value="text-to-video">Text → Video</option><option value="image-to-video">Image → Video (001.png → 001.mp4)</option><option value="start-end">Start + End</option></select></label><label>Model<select id="videoModel"><option value="ui-default">UI Default</option></select></label><label>Tỷ lệ<select id="videoRatio"><option>ui-default</option></select></label><label>Duration<select id="videoDuration"><option value="">UI Default</option></select></label><label>Thư mục ảnh nguồn<div class="row"><input id="videoImages" readonly><button data-dir="videoImages">Chọn</button></div></label><label>Thư mục video<div class="row"><input id="videoOut" readonly><button data-dir="videoOut">Chọn</button></div></label><label>Thư mục End frame (Start+End)<div class="row"><input id="endDir" readonly><button data-dir="endDir">Chọn</button></div></label><label><input type="checkbox" id="videoResume" checked> Resume, bỏ qua video đã xong</label><button class="primary" id="runVideos">CHẠY VIDEO</button></div></div><p class="note">Start+End hiện dùng 2 reference theo thứ tự Start rồi End; cần live test trên tài khoản Flow để xác nhận UI bind vai trò frame đúng như mong muốn.</p></section>
<section id="logs" class="panel"><pre id="log"></pre></section>
</main><footer><span id="progress">Sẵn sàng</span><button id="cancel">DỪNG</button></footer><script type="module" src="app.js"></script></body></html>
